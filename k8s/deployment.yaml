
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-cicd-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-cicd-lab
  template:
    metadata:
      labels:
        app: cloud-cicd-lab
    spec:
      containers:
        - name: flask-app
          image: fuugaa/cloud-cicd-lab:latest
          ports:
            - containerPort: 5000
